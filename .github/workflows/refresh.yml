name: Data gaps · Collect weekly observations
on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: govdatagaps-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Collect and validate source observations
        run: |
          python3 scripts/collect.py
          python3 scripts/collect.py --validate
          node --test tests/*.test.mjs
          python3 -m unittest discover -s tests -v
          python3 scripts/build.py
      - name: Retain validated capture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data
          if ! git diff --cached --quiet; then
            git commit -m "data: retain weekly government dataset observation"
            git push
          fi
      - name: Publish retained observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
